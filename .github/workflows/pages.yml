name: Build and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ARTIFACTS_V13_5_REVISION: 625009f513ca74a01b6e3d5d1f49801450c85783

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Artifact Lab
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Enable Corepack package-manager shims
        run: corepack enable

      - name: Install dependencies (revealive)
        run: pnpm install --frozen-lockfile
        working-directory: revealive

      - name: Build (revealive)
        run: pnpm run build
        working-directory: revealive

      - name: Install dependencies (badger-sprawl-runner)
        run: pnpm install --frozen-lockfile
        working-directory: badger-sprawl-runner

      - name: Run Hyperblast release gate
        run: npm run check:hyperblast

      - name: Checkout qualified Artifacts V13.5
        uses: actions/checkout@v5
        with:
          repository: fkr-0/artifacts-v13.5
          ref: ${{ env.ARTIFACTS_V13_5_REVISION }}
          fetch-depth: 0
          path: .artifacts-v13.5

      - name: Build and qualify V13.5 publication handoff
        run: npm run publication:handoff
        working-directory: .artifacts-v13.5
        env:
          ARTIFACTS_SOURCE_ROOT: ${{ github.workspace }}

      - name: Materialize verified V13.5 Pages stage
        run: npm run stage:v13.5 -- --out .artifacts-pages-stage
        env:
          ARTIFACTS_V13_5_ROOT: ${{ github.workspace }}/.artifacts-v13.5

      - name: Verify staged publication receipt
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('.artifacts-pages-stage/V13_5_PAGES_INTEGRATION.json', 'utf8'));
          if (receipt?.v13_5?.revision !== process.env.ARTIFACTS_V13_5_REVISION) {
            throw new Error('V13.5 revision mismatch in staged publication receipt');
          }
          if (receipt?.v13_5?.stagedV12Local !== 44 || receipt?.v13_5?.missingV12Local !== 0) {
            throw new Error('V13.5 V12 parity gate failed');
          }
          if (receipt?.v13_5?.catalogItems < 55) {
            throw new Error('V13.5 catalog-size gate failed (floor: 55)');
          }
          if (receipt?.deployment?.performed !== false) {
            throw new Error('Stage receipt must not claim deployment before deploy-pages');
          }
          console.log('V13.5 Pages receipt verified:', receipt.v13_5);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts-pages-stage

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
