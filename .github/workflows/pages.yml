name: Build and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Enable Corepack package-manager shims
        run: corepack enable

      - name: Install dependencies (revealive)
        run: pnpm install --frozen-lockfile
        working-directory: revealive

      - name: Run Hyperblast release gate
        run: npm run check:hyperblast

      - name: Materialize native V13 publication stage
        run: node scripts/build-publication-site.mjs --out .artifacts-pages-stage

      - name: Stage explicitly compiled Revealive release
        run: node scripts/stage-compiled-publication.mjs --stage .artifacts-pages-stage --id revealive

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts-pages-stage

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
