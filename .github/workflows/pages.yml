name: Build and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Artifact Lab
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Enable Corepack package-manager shims
        run: corepack enable

      - name: Install dependencies (revealive)
        run: pnpm install --frozen-lockfile
        working-directory: revealive

      - name: Build (revealive)
        run: pnpm run build
        working-directory: revealive

      - name: Install dependencies (badger-sprawl-runner)
        run: pnpm install --frozen-lockfile
        working-directory: badger-sprawl-runner

      # V12 parity requires /badger-sprawl-runner/dist/index.html. This is
      # generated (not tracked in the submodule), so installing is insufficient.
      - name: Build (badger-sprawl-runner)
        run: pnpm run build
        working-directory: badger-sprawl-runner

      # The V13.5 native superset includes the generated lobby sample. The
      # pinned peerjslib submodule does not check its dist output into Git.
      - name: Install dependencies (peerjslib)
        run: pnpm install --frozen-lockfile
        working-directory: peerjslib

      - name: Build (peerjslib-lobby-share)
        run: pnpm run sample:build
        working-directory: peerjslib

      # Git Recipe Book must be built; its tracked index.html is only a Vite dev entrypoint.
      - name: Install dependencies (git-recipe-book)
        run: pnpm install --frozen-lockfile
        working-directory: git-recipe-book

      - name: Verify Git Recipe Book
        run: pnpm lint && pnpm test
        working-directory: git-recipe-book
        env:
          # Avoid Node's experimental global Web Storage shadowing jsdom storage.
          NODE_OPTIONS: --no-experimental-webstorage

      - name: Build (git-recipe-book)
        run: pnpm build
        working-directory: git-recipe-book

      - name: Run Hyperblast release gate
        run: npm run check:hyperblast

      - name: Verify Sudoku and Killer Sudoku uniqueness and solving logic
        run: node --test tests/sudoku-lab.test.mjs tests/killer-sudoku-lab.test.mjs

      - name: Validate native source registry
        run: node tooling/artifactctl/src/cli.mjs validate

      # One checkout is the full release authority. The qualification runner
      # regenerates its catalog under an ignored build directory, checks the
      # Git commit and hub subtree, stages every route, and hashes all assets.
      - name: Materialize verified V13.5 Pages stage
        run: node scripts/qualify-monorepo.mjs

      - name: Verify staged publication receipt
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('.artifacts-pages-stage/V13_5_PAGES_INTEGRATION.json', 'utf8'));
          const { execFileSync } = require('node:child_process');
          const expectedTree = execFileSync('git', ['rev-parse', 'HEAD:hub-v13.5'], {encoding:'utf8'}).trim();
          if (receipt?.v13_5?.revision !== process.env.GITHUB_SHA ||
              receipt?.source?.currentRevision !== process.env.GITHUB_SHA ||
              receipt?.provenance?.commit !== process.env.GITHUB_SHA ||
              receipt?.provenance?.mode !== 'monorepo' ||
              receipt?.provenance?.hubTree !== expectedTree) {
            throw new Error('Monorepo revision/subtree mismatch in staged publication receipt');
          }
          if (receipt?.v13_5?.stagedV12Local !== 44 || receipt?.v13_5?.missingV12Local !== 0) {
            throw new Error('V13.5 V12 parity gate failed');
          }
          if (receipt?.v13_5?.catalogItems < 55) {
            throw new Error('V13.5 catalog-size gate failed (floor: 55)');
          }
          if (receipt?.deployment?.performed !== false) {
            throw new Error('Stage receipt must not claim deployment before deploy-pages');
          }
          console.log('V13.5 Pages receipt verified:', receipt.v13_5);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts-pages-stage

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
