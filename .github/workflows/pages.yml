name: Deploy Verified Pages Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify committed snapshot
        run: |
          test -f pages-snapshot/BUILD_MANIFEST.json
          test -f pages-snapshot/hub/v13/index.html
          test -f pages-snapshot/hub/v13/peer-lobby.js
          test -f pages-snapshot/artifacts/sprite-fan-atlas-studio/1.0.0/atlas-studio.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-snapshot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
