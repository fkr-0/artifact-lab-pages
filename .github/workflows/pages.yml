name: Build and Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Optional qualified whole-site tar.gz URL (skip source builds)'
        type: string
      site_sha256:
        description: 'Required SHA-256 when site_url is supplied'
        type: string
      site_revision:
        description: 'Required full source commit when site_url is supplied'
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install root tools
        run: pnpm install --frozen-lockfile

      - name: Validate YAML inventory
        run: pnpm inventory:check

      - name: Resolve recipes, build releases and qualify complete site
        if: ${{ !inputs.site_url }}
        run: pnpm build

      - name: Import a qualified prebuilt complete site
        if: ${{ inputs.site_url }}
        run: pnpm import:site
        env:
          SITE_URL: ${{ inputs.site_url }}
          SITE_SHA256: ${{ inputs.site_sha256 }}
          SITE_REVISION: ${{ inputs.site_revision }}

      - name: Check root, tooling and hub contracts
        if: ${{ !inputs.site_url }}
        run: pnpm check

      - name: Browser smoke against publication output
        if: ${{ !inputs.site_url }}
        run: |
          pnpm exec playwright install --with-deps chromium
          CHROMIUM_BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")" node hub-v13.5/tests/qualification/browser-smoke.mjs dist/site

      - name: Verify exact publication file inventory
        run: pnpm verify:site
        env:
          SITE_REVISION: ${{ inputs.site_revision || github.sha }}

      - name: Upload qualified site for review
        uses: actions/upload-artifact@v4
        with:
          name: qualified-site
          path: dist/site/
          if-no-files-found: error

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
