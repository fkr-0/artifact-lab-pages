<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sprite Sheet Alpha Cleaner</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #202124;
      color: white;
      padding: 24px;
    }
    canvas {
      image-rendering: pixelated;
      max-width: 95vw;
      border: 1px solid #555;
      background:
        linear-gradient(45deg, #888 25%, transparent 25%),
        linear-gradient(-45deg, #888 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #888 75%),
        linear-gradient(-45deg, transparent 75%, #888 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    label { display: block; margin: 12px 0; }
    button { margin-right: 8px; padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>Sprite Sheet Alpha Cleaner</h1>

  <input type="file" id="file" accept="image/*" />

  <label>
    Background tolerance:
    <input id="tol" type="range" min="5" max="80" value="32" />
    <span id="tolVal">32</span>
  </label>

  <button id="clean">Remove Background</button>
  <button id="download">Download PNG</button>

  <p>
    Tip: increase tolerance if faint checker pixels remain. Decrease it if pale fur or effects are being erased.
  </p>

  <canvas id="canvas"></canvas>

<script>
const fileInput = document.getElementById("file");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const tol = document.getElementById("tol");
const tolVal = document.getElementById("tolVal");

tol.oninput = () => tolVal.textContent = tol.value;

fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file) return;

  const img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src);
  };
};

function colorDistance(r, g, b, tr, tg, tb) {
  const dr = r - tr;
  const dg = g - tg;
  const db = b - tb;
  return Math.sqrt(dr * dr + dg * dg + db * db);
}

function isBackgroundLike(r, g, b, tolerance) {
  // Common baked checker/white background colors.
  const targets = [
    [255, 255, 255],
    [250, 250, 250],
    [245, 245, 245],
    [238, 238, 238],
    [230, 230, 230],
    [224, 224, 224],
    [216, 216, 216]
  ];

  // Require low saturation so purple/black sprite pixels are protected.
  const maxc = Math.max(r, g, b);
  const minc = Math.min(r, g, b);
  const saturation = maxc - minc;

  if (saturation > 18) return false;

  return targets.some(([tr, tg, tb]) =>
    colorDistance(r, g, b, tr, tg, tb) <= tolerance
  );
}

document.getElementById("clean").onclick = () => {
  const w = canvas.width;
  const h = canvas.height;
  if (!w || !h) return;

  const image = ctx.getImageData(0, 0, w, h);
  const data = image.data;
  const visited = new Uint8Array(w * h);
  const queue = [];
  const tolerance = Number(tol.value);

  function push(x, y) {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const i = y * w + x;
    if (visited[i]) return;
    visited[i] = 1;

    const p = i * 4;
    const r = data[p];
    const g = data[p + 1];
    const b = data[p + 2];
    const a = data[p + 3];

    if (a === 0 || isBackgroundLike(r, g, b, tolerance)) {
      queue.push([x, y]);
    }
  }

  // Seed from all canvas edges.
  for (let x = 0; x < w; x++) {
    push(x, 0);
    push(x, h - 1);
  }
  for (let y = 0; y < h; y++) {
    push(0, y);
    push(w - 1, y);
  }

  // Flood-fill only contiguous edge-connected background.
  while (queue.length) {
    const [x, y] = queue.pop();
    const i = y * w + x;
    const p = i * 4;

    data[p + 3] = 0;

    push(x + 1, y);
    push(x - 1, y);
    push(x, y + 1);
    push(x, y - 1);
  }

  ctx.putImageData(image, 0, 0);
};

document.getElementById("download").onclick = () => {
  const a = document.createElement("a");
  a.download = "sprite-sheet-alpha.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
};
</script>
</body>
</html>
