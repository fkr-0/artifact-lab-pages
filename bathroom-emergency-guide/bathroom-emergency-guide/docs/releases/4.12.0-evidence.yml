release_decisions:
  - Code and route title are the primary identity carriers; colour accelerates scanning while pattern and written glyph name preserve identity in monochrome and spoken handoffs.
  - Blue Book forms remain owned by T even when multiple operational routes use them; one maintained form replaces parallel copies.
  - Reference indexes writable resources but does not maintain a second blank-form system.
  - Professional Support owns service-selection and handoff logic while local contact facts remain in the canonical T contact form.
  - Five clearer headings retain their previous stable public IDs.
  - A remains master-only pending an equivalent visual and standalone review.
  - The Pages package and deployment workflow remain prepared but were not invoked.

known_limits:
  - Build evidence does not prove that a service answered, a handoff succeeded, a form was completed accurately, or a route worked under real stress.
  - The colour/pattern/glyph system has not yet received external usability testing with readers using monochrome printers, screen readers, cognitive-access supports, or spoken handoffs.
  - The added figure cards and form bands increased page counts; automated geometry, density, overflow, semantic-parity, and accessibility gates passed, but direct manual page-by-page visual inspection was not performed in this run.
  - A diagnostic pre-release build encountered a full root filesystem. Only the reproducible project build tree and obsolete Playwright Chromium 1223 caches were removed; the clean full build and exact-revision build then passed with the current Chromium runtime.
  - Local Fontconfig emitted known configuration warnings and unavailable font-weight fallbacks; tagging, geometry, text parity, accessibility, and edge checks passed.
