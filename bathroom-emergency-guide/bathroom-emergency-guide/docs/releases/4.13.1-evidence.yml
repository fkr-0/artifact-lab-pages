release_decisions:
  - The patch changes render tooling and release metadata only; reader-facing routes and evidence claims are unchanged.
  - The visualization catalog is the canonical owner of the Fontconfig profile path.
  - Fontconfig is set before Vega and native canvas dependencies are imported.
  - Renderer stderr is surfaced even when the child process succeeds.
  - No existing stable reference was renumbered, reused, or retired.
  - The Pages package and deployment workflow remain prepared but were not invoked.

known_limits:
  - Build evidence does not establish real-world route availability, successful crisis use, clinical outcomes, or deployment quality.
  - The project-local Fontconfig profile assumes the configured DejaVu families are installed on the build host; the smoke validator fails if rendering cannot complete.
  - The changed diagram contact sheet was directly reviewed. Larger A and master contact sheets were generated but were not directly viewable inside the agent runtime because the bridge and inspection container use separate file namespaces; automated page, edge, density, semantic-parity, and accessibility checks passed.
