release_decisions:
  - O uses the generated standalone cover and page-zero emergency gate plus the canonical Observatory chapter; the master cover is deliberately not copied.
  - D uses the D-owned mixed-situations section plus the complete safe-place chapter; no parallel standalone prose source was introduced.
  - A and Z remain master-only instead of being released merely to complete the ten-node graph.
  - The Pages package and deployment workflow remain prepared but were not invoked.
  - No existing stable reference was renumbered or reused.

known_limits:
  - Build and rendering checks do not establish that readers can select O or D correctly during an actual crisis; real-reader route testing remains outstanding.
  - Safe-place directories, municipal accommodation, transport, accessibility, and service capacity remain local, time-sensitive facts requiring dated deployer verification.
  - No new figure artwork was introduced in 4.10.0; existing O/D figures were reflowed into standalone editions and passed source, fallback, tagging, geometry, accessibility, overflow, and color/mono checks. Direct manual image inspection was not available through the current bridge interface.
  - Actual wet-room installations and route drills remain outstanding; the Blue Book supplies recording forms but does not claim field completion.
  - Local Fontconfig emitted configuration warnings and unavailable font-weight fallbacks; tagging, geometry, text parity, accessibility, and edge checks passed.
