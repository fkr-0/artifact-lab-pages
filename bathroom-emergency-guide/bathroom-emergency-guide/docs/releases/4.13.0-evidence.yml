release_decisions:
  - A uses the complete canonical responsibility and care chapter; no parallel standalone prose source was introduced.
  - Immediate safety outranks blame, confession, explanation, or later repair.
  - Apology, acceptance, forgiveness, liability, consent, capacity, authority, and completed repair remain distinct claims.
  - Blue Book forms remain owned by T and are linked into A rather than copied.
  - All ten maintained route identities now have released standalone families.
  - The Pages package and deployment workflow remain prepared but were not invoked.
  - No existing stable reference was renumbered, reused, or retired.

known_limits:
  - Build evidence does not establish legal liability, clinical capacity, valid consent, forgiveness, service availability, or successful real-world repair.
  - The consent/capacity/authority figure requires external review with disability advocates, clinicians, safeguarding practitioners, and legal advisers before being treated as a professional protocol.
  - The care-continuity model has not been field-tested with caregivers, disability-support households, veterinary users, or operators of critical household systems.
  - Figure generator source, raster dimensions, content margins, adjacent prose, text fallbacks, monochrome strategies, PDF geometry, density, accessibility, and overflow were inspected; direct manual pixel-by-pixel or page-by-page visual inspection was not available in this run.
  - Local Fontconfig emitted known configuration warnings and unavailable black-weight fallbacks; tagging, geometry, text parity, accessibility, and edge checks passed.
