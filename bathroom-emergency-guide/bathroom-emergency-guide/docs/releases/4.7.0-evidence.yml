release_decisions:
  - C and P are extracted from canonical owned content; no parallel standalone prose source was introduced.
  - Standalone visual counts are measured after Vega macro expansion, fixing the pre-4.7 manifest undercount.
  - The P diagrams use direct labels, fixed order, number, width, and shape so monochrome output does not depend on colour.
  - The support-layer figure explicitly rejects ranking deservingness or requiring lower layers to be exhausted first.
  - The route-selector figure does not promise housing, treatment, or authority outcomes; the adjacent matrix remains canonical text.
  - No existing stable reference was renumbered or reused.

known_limits:
  - Actual first-aid figure usability sessions with instructors and readers without CPR practice remain outstanding.
  - The three new P figures passed source, text-fallback, raster-boundary, PDF geometry, accessibility, and color/mono checks; a direct manual image review was not available through the current bridge interface.
  - Actual wet-room installations and route drills remain outstanding; the Blue Book supplies the protocol and recording forms.
  - Local services and safe destinations still require dated deployer verification.
  - Local Fontconfig emitted configuration warnings and unavailable font-weight fallbacks; tagging, geometry, text parity, accessibility, and edge checks passed.
  - OpenCode provider preflight reported an exhausted active credential and fewer than two usable pooled keys, so no independent subagent review is claimed.
