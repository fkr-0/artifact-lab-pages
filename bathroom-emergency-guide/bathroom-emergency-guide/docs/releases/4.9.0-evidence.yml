improved_slices:
  O:
    title: Small-Room Observatory
    local_sources: 11
    owned_reader_visuals: 4
    readiness: standalone-candidate
    released_standalone: false
    new_visuals:
      - observatory-scan
      - interoception-loop
      - signal-story-question
      - three-minute-observation
    editorial_boundaries:
      - the first route scans body, room, and attention before diagnostic interpretation
      - the three-minute experiment is observation rather than mandatory delay
      - danger, worsening, or loss of safe comparison stops the experiment
      - no improvement after one controlled change is a route-changing result
  D:
    title: Threat and Safe Place
    local_sources: 8
    owned_reader_visuals: 4
    readiness: standalone-candidate
    released_standalone: false
    redesigned_visuals:
      - safe-place-route-map
      - communication-access-card
    new_visuals:
      - safe-place-confirmation-packet
      - safe-reserve-clock
    editorial_boundaries:
      - a suggested place is not confirmed until destination, availability, access, arrival, backup, and escalation are usable
      - remaining safe runtime is an estimate rather than a guarantee
      - no generic battery, medication, caregiver, or transport runtime constant is introduced
      - unknown reserve is treated as time-critical rather than assumed plentiful

