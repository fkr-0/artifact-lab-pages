release_decisions:
  - O and D cross only the numerical source/visual candidate screen; neither is detached or advertised as a released standalone family.
  - New diagrams use number, order, shape, direct labels, and adjacent complete prose so meaning does not depend on colour or embedded image text.
  - Observation language does not diagnose, clear danger, or require waiting through worsening symptoms.
  - Safe-place language distinguishes a possible direction from a confirmed destination and backup.
  - The reserve-clock figure deliberately contains no generic device, medication, care, or transport duration.
  - Existing stable references were not renumbered or reused; new active resources were appended.
  - The prepared Pages workflow remains separate from this local release and was not invoked.

known_limits:
  - Actual novice and expert usability sessions for the new observation and safe-place figures remain outstanding.
  - Disability-route, violence-support, municipal-service, caregiver, and device-user route drills remain outstanding.
  - Direct visual viewing was unavailable through the active bridge interface; figures were checked through source review, raster dimensions and pixel margins, adjacent fallbacks, PDF rendering, contact sheets, geometry, accessibility, overflow, and color/mono tests.
  - Actual wet-room installations and physical page-turning, glare, moisture, reach, and replacement tests remain outstanding.
  - Local services and safe destinations still require dated deployer verification.
  - Local Fontconfig emitted configuration warnings and unavailable black-weight fallbacks; geometry, text parity, accessibility, edge, and browser checks passed.
