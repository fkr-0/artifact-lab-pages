release_decisions:
  - Z uses the complete canonical outage and continuity chapter; no parallel standalone prose source was introduced.
  - The warning-verification instruction now carries a local BBK source for NINA and Cell Broadcast.
  - A remains master-only rather than being released with only one owned reader visual.
  - The Pages package and deployment workflow remain prepared but were not invoked.
  - No existing stable reference was renumbered or reused.

known_limits:
  - Build and rendering checks do not establish that readers can select or operate Z correctly during a real outage, evacuation, or disaster; route drills remain outstanding.
  - Warning delivery, device compatibility, municipal instructions, water availability, transport, shelter, power restoration, and service capacity remain local and time-sensitive facts.
  - No new figure artwork was introduced in 4.11.0; existing Z figures were reflowed into standalone editions and passed source, fallback, tagging, geometry, accessibility, overflow, and color/mono checks. Direct manual image inspection was not performed in this run.
  - Actual wet-room installations, household continuity exercises, and emergency supply audits remain outstanding.
  - Local Fontconfig emitted configuration warnings and unavailable font-weight fallbacks; tagging, geometry, text parity, accessibility, and edge checks passed.
