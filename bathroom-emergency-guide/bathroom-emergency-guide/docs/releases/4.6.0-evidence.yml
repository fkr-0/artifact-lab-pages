release_decisions:
  - Canonical addresses use stable typed IDs such as [BEG:T:F:003]; hierarchical numbers remain non-canonical navigation aids because insertions would rename downstream resources.
  - T and R are detached now; the remaining six graph nodes stay in the complete guide until they receive equivalent source, visual, layout, and accessibility review.
  - AED language describes rhythm analysis and shocks only when indicated; the inaccurate universal reboot metaphor is rejected.
  - Effective coughing remains the first choking principle; unreviewed self-thrust and furniture manoeuvres are not shipped.
  - A complete bird-folding tutorial and puzzle packs remain deferred until diagram, licensing, difficulty, and accessibility review.
  - Shared installations must not expose hidden-key locations, credentials, private medical details, or violence-related safe places.

known_limits:
  - The new CPR, AED, and recovery-position figures passed source, raster-boundary, alt-text, physical-edge, and print checks but still need usability review with first-aid instructors and readers without prior CPR practice.
  - Real bathroom mounting concepts remain proposals until tested for water, glare, reach, privacy, page turning, replacement, and maintenance.
  - Local service numbers and safe destinations remain deployment fields requiring dated verification by the deployer.
  - Local Fontconfig emitted configuration warnings during rendering; output generation, tagging, geometry, text parity, and accessibility checks nevertheless passed.
  - The attempted independent OpenCode repository review failed in its adapter before repository inspection; no review evidence is claimed from it.
