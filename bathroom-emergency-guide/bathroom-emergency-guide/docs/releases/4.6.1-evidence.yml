release_decisions:
  - Field-test forms capture observations and failure modes; they do not claim that instructor, novice-reader, or real-bathroom testing has already occurred.
  - The coverage matrix is generated from canonical section, source, figure, illustration, and subguide registries rather than manually maintained totals.
  - Numeric standalone readiness is only a screening gate; editorial, source, layout, accessibility, and usability review remain mandatory.
  - C crosses the numeric standalone-candidate screen. P has sufficient local sources but remains below the four-owned-visual screen.
  - No existing stable reference was renumbered or reused.

known_limits:
  - Actual first-aid figure usability sessions with instructors and readers without CPR practice remain outstanding.
  - Actual wet-room installations and route drills remain outstanding; 4.6.1 supplies the protocol and recording forms.
  - Local services and safe destinations still require dated deployer verification.
  - Local Fontconfig emitted configuration warnings and unavailable font-weight fallbacks; tagging, geometry, text parity, accessibility, and edge checks passed.
  - OpenCode provider preflight reported an exhausted active credential and fewer than two usable pooled keys, so no independent subagent review is claimed.
