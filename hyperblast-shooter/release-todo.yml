release_todo:
  metadata:
    project: hyperblast-shooter
    release_target: v0.1-first-playable-release
    status: in_progress
    updated: 2026-06-08
    gate_command: npm run check:hyperblast
    release_principle: >-
      Ship a small, honest browser-game release: strong single-player smoke coverage,
      experimental coop/VS visibility, safe UI rendering for dynamic text, and CI-enforced
      deploy protection. Avoid claiming production-grade multiplayer until real-network
      PeerJS tests and VS gameplay semantics are implemented.

  release_cutoff:
    required_for_v0_1:
      - id: P0-001
        title: Run the Hyperblast release gate in CI before Pages deployment
        status: implemented
        severity: P0
        rationale: >-
          Local verification is not enough for a first release. The GitHub Pages workflow
          previously materialized and uploaded the site without running the scoped Hyperblast
          Node and Playwright tests, so a regression could be deployed even when the local
          gate would catch it.
        implementation:
          files:
            - ../.github/workflows/pages.yml
            - ../package.json
          details:
            - Added a named Pages workflow step: Run Hyperblast release gate.
            - Step runs npm run check:hyperblast before materializing the deploy stage.
        verification:
          tests:
            - tests/hyperblast-release-smoke.mjs checks workflow ordering and script presence.
          commands:
            - npm run check:hyperblast
        acceptance_criteria:
          - CI runs npm run check:hyperblast before artifact upload.
          - The workflow text makes the release gate visible to maintainers.

      - id: P0-002
        title: Sanitize multiplayer player-list rendering
        status: implemented
        severity: P0
        rationale: >-
          Multiplayer names and colors are dynamic peer-supplied content. Story and achievement
          rendering were already made safe; the player list needed the same treatment before
          coop mode can be release-visible.
        implementation:
          files:
            - index.html
            - js/render-safe.js
            - ../tests/e2e/hyperblast-safe-rendering.spec.mjs
          details:
            - Escaped peer usernames with escapeHtml.
            - Sanitized CSS colors with safeCssColor.
            - Coerced peer scores with safeInteger.
            - Added E2E coverage proving malicious peer data does not create img/script DOM nodes.
        verification:
          commands:
            - npx playwright test tests/e2e/hyperblast-safe-rendering.spec.mjs --project=chromium
            - npm run check:hyperblast
        acceptance_criteria:
          - Remote username appears as text.
          - Remote color never contains javascript/url CSS.
          - Remote score is numeric and safe.
          - No injected event handler executes.

      - id: P0-003
        title: Provide release README and explicit limitations
        status: implemented
        severity: P0
        rationale: >-
          A first release needs a user/developer entry point that states how to run the game,
          how to verify it, how controls/rebinding work, and which multiplayer features are
          experimental.
        implementation:
          files:
            - README.md
            - release-todo.yml
          details:
            - Added first-release README with controls, release gate, coop/VS notes, and known limitations.
            - Added this machine-readable release-todo.yml.
        verification:
          tests:
            - tests/hyperblast-release-smoke.mjs checks README and release-todo contents.
        acceptance_criteria:
          - README documents npm run check:hyperblast.
          - README documents Key rebinding.
          - README labels Versus Mode (experimental).

    strongly_recommended_before_v0_1:
      - id: P1-001
        title: Persist and reload custom keybindings
        status: implemented
        severity: P1
        rationale: >-
          Custom controls are release-visible. If a user rebinds movement, reloads, and loses the
          binding unexpectedly, it feels broken and can recreate the original horizontal movement issue.
        implementation:
          files:
            - js/input.js
            - js/ui.js
            - index.html
            - ../tests/e2e/hyperblast-keybindings.spec.mjs
          details:
            - Custom bindings are saved in shooter-settings.
            - Runtime refreshes key bindings from UI settings before start.
            - E2E verifies Move Right rebound to L survives reload.
        verification:
          commands:
            - npx playwright test tests/e2e/hyperblast-keybindings.spec.mjs --project=chromium
        acceptance_criteria:
          - Rebound Move Right key remains visible after reload.
          - Rebound key still moves horizontally.

      - id: P1-002
        title: Add keybinding reset coverage
        status: implemented
        severity: P1
        rationale: >-
          A bad custom binding can make the game difficult to control. Reset must restore a known-safe
          default with both arrows and WASD, because the original report involved horizontal movement
          sometimes not working.
        implementation:
          files:
            - js/ui.js
            - ../tests/e2e/hyperblast-keybindings.spec.mjs
          details:
            - Reset Bindings now restores normalizeKeyBindings defaults instead of only the WASD preset.
            - E2E verifies ArrowRight and D both move horizontally after reset.
        verification:
          commands:
            - npx playwright test tests/e2e/hyperblast-keybindings.spec.mjs --project=chromium
        acceptance_criteria:
          - Reset restores ArrowRight and D for Move Right.
          - Browser movement works after reset.

      - id: P1-003
        title: Label VS mode as experimental unless full VS gameplay is implemented
        status: implemented
        severity: P1
        rationale: >-
          VS mode is currently a negotiated/broadcast match mode. It does not yet implement remote-player
          damage, win/loss conditions, or balance. The UI and docs must not imply finished competitive play.
        implementation:
          files:
            - js/ui.js
            - README.md
            - docs/multiplayer-input-remaining-tasks.md
          details:
            - Setup menu exposes Versus Mode (experimental).
            - README documents current VS limitation.
        verification:
          tests:
            - tests/hyperblast-release-smoke.mjs checks README wording.
        acceptance_criteria:
          - UI and README mark VS as experimental.
          - Full VS semantics are tracked as remaining work.

      - id: P1-004
        title: Add corrupt-storage boot E2E
        status: implemented
        severity: P1
        rationale: >-
          Hyperblast stores progress and settings in localStorage. Corrupt or older browser storage must
          not prevent the game from booting into safe defaults.
        implementation:
          files:
            - ../tests/e2e/hyperblast-storage.spec.mjs
          details:
            - Seeds invalid progress and settings JSON.
            - Reloads the game.
            - Verifies score/lives/session/default keybindings.
        verification:
          commands:
            - npx playwright test tests/e2e/hyperblast-storage.spec.mjs --project=chromium
        acceptance_criteria:
          - Game boots after corrupt storage.
          - Defaults are restored.
          - No serious browser runtime errors are recorded.

      - id: P1-005
        title: Add minimal performance/frame-budget smoke
        status: implemented
        severity: P1
        rationale: >-
          The first release should catch obvious runaway physics regressions. A focused smoke test is
          intentionally small and deterministic; it does not replace profiling.
        implementation:
          files:
            - ../tests/hyperblast-performance-smoke.mjs
          details:
            - Runs 5000 player-flight updates with changing input.
            - Asserts finite state, preserved bounds, and a conservative time budget.
        verification:
          commands:
            - node --test tests/hyperblast-performance-smoke.mjs
        acceptance_criteria:
          - Flight update remains deterministic and bounded.
          - Smoke budget remains comfortably below threshold.

    deferred_after_v0_1:
      - id: P2-001
        title: Real PeerJS network smoke test
        status: deferred
        severity: P2
        rationale: >-
          Default CI uses a deterministic fake Peernet transport so tests are reliable and do not depend
          on public PeerJS brokers. A separate optional/manual test should cover real broker connectivity.
        acceptance_criteria:
          - Two browsers connect through real PeernetLobby without replacing peernet-lib.js.
          - Test is quarantined from default CI if internet/public broker availability is required.

      - id: P2-002
        title: Full VS gameplay semantics
        status: deferred
        severity: P2
        rationale: >-
          VS mode now exists as match negotiation and UI mode, but not as complete competitive gameplay.
        acceptance_criteria:
          - Define remote bullet damage rules.
          - Define scoreboard and winner conditions.
          - Add unit and E2E coverage for a simulated VS hit/score event.

      - id: P2-003
        title: Complete remaining innerHTML migration
        status: deferred
        severity: P2
        rationale: >-
          Highest-risk dynamic sinks are now covered, but several static/panel HTML builders remain.
          They should be migrated incrementally behind render-model tests.
        acceptance_criteria:
          - Remaining dynamic panel content uses escaped render helpers or DOM text APIs.
          - An allowlist documents any intentionally trusted static HTML.
