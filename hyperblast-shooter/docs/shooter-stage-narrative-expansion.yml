---
hyperblast_stage_content:
  metadata:
    title: "Hyperblast Shooter - Stage Narrative Expansion"
    purpose: "Reusable YAML for stage dialogue, side-quests, minigames, world building, texture descriptions, character pools, ship names, place names, and idle dialogue."
    tone: "neon arcade sci-fi with noir, cyberpunk, jazz, hiphop, hacker, philosophical, and street-underground flavor"
    note: "All names and references are original, using the requested cultural flavor as inspiration rather than direct borrowing."

  global_dialogue_rules:
    hud_line_max_words: 16
    idle_trigger_seconds:
      first_idle: 12
      second_idle: 25
      long_idle: 45
    speaker_style:
      COMMAND: "formal, tactical, increasingly uncertain"
      DOC: "warm, practical, improvising under pressure"
      PLAYER: "brave, cocky, street-smart"
      UNKNOWN: "cryptic, static-heavy, morally unclear"
      VIPER: "menacing, calm, revolutionary, not cartoonish"
      ALLY_PILOT: "sharp, cooperative, competitive"
      LOCAL_SIGNAL: "fragmentary, poetic, corrupted"

  stages:
    - stage_id: "STAGE_01"
      stage_title: "Neon Drift"
      linked_chapters:
        - "CH01"
        - "CH02"
      aesthetic_tags:
        - "cyan noir"
        - "rain-on-glass neon"
        - "detective alley in orbit"
        - "early hiphop block-party static"
        - "hardboiled patrol mystery"
      world_building:
        sector_name: "Caldera Mile"
        major_area: "Neon Drift Lanes"
        nearby_planet: "Orpheon-7"
        local_places:
          - "Blue Note Debris Yard"
          - "Sable Ticket Dock"
          - "The Monad Underpass"
          - "Cipher Tenement Array"
          - "Cold Lamp Toll Gate"
        local_factions:
          - faction_name: "Drift Runners"
            description: "Old courier crews who know every illegal lane and every dead beacon."
          - faction_name: "The Lampblack Union"
            description: "Dock workers, mechanics, smugglers, and signal hackers sharing shelter inside abandoned toll stations."
          - faction_name: "Rogue Scout Packs"
            description: "Fast enemy cells pretending to be pirates while flying military-grade formations."
        lore_notes:
          - "Neon Drift was once a legal trade corridor before toll wars and sabotage drove shipping underground."
          - "Graffiti tags on wreckage mark safe routes, ambush zones, and old labor strikes."
          - "The first rogue ships appear random until their attack angles form repeating mathematical patterns."
      texture_descriptions:
        background:
          - "deep black lanes with cyan signage flickering through static"
          - "distant city glow reflected on orbital dust clouds"
          - "thin rain-like particle streaks moving diagonally across the screen"
        foreground:
          - "broken toll arches"
          - "spray-painted cargo ribs"
          - "floating road signs with missing letters"
          - "discarded antenna clusters sparking blue"
        enemy_visuals:
          - "small ships with cheap pirate paint layered over precise military hulls"
          - "cyan target lights pulsing in sync like a shared beat"
          - "Scout Pack engines leave short square-wave trails"
        pickup_visuals:
          - "credits appear as bright data-coins stamped with emergency salvage marks"
          - "repair pickups glow like little motel vacancy signs"
        ui_flavor:
          - "mission text flickers like a bad subtitle reel"
          - "combo counter uses blocky trainwriting-style numerals"
      characters:
        local_named_signals:
          - name: "Rook Ten-Forty"
            role: "drift informant signal"
            flavor: "noir dispatcher, half-jazz host, half-police scanner"
          - name: "DJ Monad"
            role: "illegal beacon keeper"
            flavor: "beat-maker hacker who loops warning pings into rhythm"
          - name: "Sable Quinn"
            role: "missing salvage captain"
            flavor: "hardboiled witness, presumed dead"
        enemy_callsigns:
          - "Blue Knife Scout"
          - "Ticker Jackal"
          - "Lamprey-808"
          - "Static Rook"
        ship_model_names:
          player_models:
            - "Interceptor Ibis"
            - "Guardian Brickhouse"
            - "Striker Redcheck"
          enemy_models:
            - "Needle Pup"
            - "Tin Canary"
            - "Switchblade Moth"
      dialogues:
        briefing:
          - speaker: "COMMAND"
            text: "Pilot, Neon Drift is full of distress pings. Start with the loudest."
          - speaker: "PLAYER"
            text: "Copy. If it blinks, I chase it."
          - speaker: "DOC"
            text: "Your Interceptor is quick, thin, and uninsured. Try style and survival."
        arrival:
          - speaker: "COMMAND"
            text: "Traffic logs show six ships. Visual shows twenty."
          - speaker: "PLAYER"
            text: "Then the logs are lying or the ships are multiplying."
          - speaker: "DOC"
            text: "Neither option helps my blood pressure."
        combat:
          - speaker: "PLAYER"
            text: "These scouts move like they rehearsed."
          - speaker: "COMMAND"
            text: "Pirates do not hold formation that cleanly."
          - speaker: "DOC"
            text: "Shoot one loose. I want its flight recorder."
        discovery:
          - speaker: "LOCAL_SIGNAL"
            text: "Blue lane closed. Blue lane hungry. Pay with sparks."
          - speaker: "PLAYER"
            text: "That beacon needs either repair or therapy."
          - speaker: "COMMAND"
            text: "Mark it. Do not answer it."
        victory:
          - speaker: "COMMAND"
            text: "Lane cleared. Distress traffic is dropping."
          - speaker: "DOC"
            text: "And salvage traffic is rising. Convenient."
          - speaker: "PLAYER"
            text: "I prefer my paycheck glowing."
        nothing_happens_dialogue:
          - trigger: "first_idle"
            lines:
              - speaker: "DOC"
                text: "Pilot, your engines are on. That usually means moving."
              - speaker: "PLAYER"
                text: "I am listening to the static. It has opinions."
          - trigger: "second_idle"
            lines:
              - speaker: "COMMAND"
                text: "Status check. Are you disabled?"
              - speaker: "PLAYER"
                text: "Negative. Just letting the void feel awkward."
          - trigger: "long_idle"
            lines:
              - speaker: "LOCAL_SIGNAL"
                text: "Stillness detected. Toll unpaid. Courage pending."
              - speaker: "DOC"
                text: "Even the haunted traffic sign is judging you."
      side_quests:
        - quest_id: "ND_SQ_01"
          title: "Tag the Dead Beacons"
          objective: "Fly near three broken distress beacons without destroying them."
          reward: "bonus credits and a hidden route marker"
          narrative_hook: "The beacons contain coded graffiti tags used by old courier crews."
        - quest_id: "ND_SQ_02"
          title: "Recover Sable Quinn's Recorder"
          objective: "Destroy Scout Pack elites before they escape the lane."
          reward: "shipyard discount on first weapon upgrade"
          narrative_hook: "The recorder proves the rogues received orders before the distress call began."
        - quest_id: "ND_SQ_03"
          title: "Noir Clean Sweep"
          objective: "Clear a wave without taking shield damage."
          reward: "achievement: Clean Suit, Dirty Sky"
          narrative_hook: "Command notes the pilot's precision. Doc calls it luck with posture."
      minigames:
        - minigame_id: "ND_MG_01"
          title: "Signal Scratch"
          type: "timing"
          objective: "Match pulsing beacon beats to decode a distress fragment."
          input_pattern: "tap or hold on beat pulses"
          success_effect: "reveals hidden credit cache"
          failure_effect: "spawns a Scout Pack ambush"
        - minigame_id: "ND_MG_02"
          title: "Toll Gate Hack"
          type: "lane-switch reflex"
          objective: "Dodge shifting neon gates while Doc spoofs the toll system."
          success_effect: "temporary credit multiplier"
          failure_effect: "minor hull damage and hostile scan"
      boss_or_elite_hooks:
        - type: "elite"
          name: "Scout Pack"
          intro_dialogue:
            - speaker: "COMMAND"
              text: "Three fast movers breaking from shadow."
            - speaker: "PLAYER"
              text: "Good. I hate waiting in line."
          mechanic_note: "Fast swarm pressure, weak armor, coordinated crossfire."
      multiplayer:
        room_flavor_names:
          - "Blue Lamp Public Run"
          - "Cipher Alley Private Room"
          - "Cold Gate Ranked Patrol"
        coop_variant:
          objective: "Two pilots split beacon-tagging duty while shared Scout Packs hunt the weaker ship."
          dialogue:
            - speaker: "ALLY_PILOT"
              text: "I take high lane. You take trouble."
            - speaker: "PLAYER"
              text: "I always take trouble."

    - stage_id: "STAGE_02"
      stage_title: "Ember Belt"
      linked_chapters:
        - "CH03"
        - "CH04"
      aesthetic_tags:
        - "orange heat haze"
        - "volcanic asteroid noir"
        - "dub echo distress"
        - "labor strike furnace"
        - "sensor distortion paranoia"
      world_building:
        sector_name: "Red Ledger Expanse"
        major_area: "Ember Belt"
        nearby_planet: "Moloch Minor"
        local_places:
          - "Cinder Union Works"
          - "Ashmouth Relay Spur"
          - "Boiler Saint Graveyard"
          - "The Red Ledger Docks"
          - "Furnace Room Nine"
        local_factions:
          - faction_name: "Cinder Union Remnant"
            description: "Old mining crews who abandoned the belt after corporate extraction wars."
          - faction_name: "Heat Ghosts"
            description: "False contacts caused by thermal distortion, sometimes indistinguishable from real enemies."
          - faction_name: "Viper's Blockade Cell"
            description: "A tactical unit using heat bloom to mask carrier movements."
        lore_notes:
          - "The Ember Belt was mined until its asteroids cracked open and started burning from within."
          - "Old strike slogans are still painted on station hulls, half-melted but readable."
          - "Enemy ships exploit the heat like street magicians, appearing where sensors say nothing exists."
      texture_descriptions:
        background:
          - "molten orange asteroid fields with black fracture lines"
          - "slow lava bubbles rising from broken planetoids"
          - "thermal shimmer that bends stars and enemy silhouettes"
        foreground:
          - "rusted mining claws"
          - "slag chains drifting between rocks"
          - "union placards fused into hull plating"
          - "broken furnace vents coughing sparks"
        enemy_visuals:
          - "ships painted in soot-black with ember engine cores"
          - "Blockade Carrier armor glows from inside like a cracked stove"
          - "Interdictor mines flicker red before vanishing into heat haze"
        pickup_visuals:
          - "credits look scorched and unstable"
          - "repair nodes appear as coolant canisters wrapped in warning tape"
        ui_flavor:
          - "sensor pings lag behind actual enemy positions"
          - "heat warning meter jitters like a broken VU meter"
      characters:
        local_named_signals:
          - name: "Boiler Saint"
            role: "dead miner myth"
            flavor: "labor martyr turned corrupted emergency beacon"
          - name: "Mags Redhand"
            role: "shipyard quartermaster"
            flavor: "practical, union-minded, suspicious of Command"
          - name: "Echo Kettle"
            role: "dub-tech signal ghost"
            flavor: "repeats old strike chants through delay loops"
        enemy_callsigns:
          - "Coal Choir"
          - "Ash Jack"
          - "Redline Wasp"
          - "Furnace Bishop"
        ship_model_names:
          player_models:
            - "Guardian Brickhouse"
            - "Striker Redcheck"
            - "Interceptor Sootfin"
          enemy_models:
            - "Cinder Needle"
            - "Heat Mantis"
            - "Boiler Fang"
      dialogues:
        briefing:
          - speaker: "COMMAND"
            text: "The Ember Belt will blind your sensors. Stay sharp."
          - speaker: "DOC"
            text: "I added heat filters. They are mostly optimistic."
          - speaker: "PLAYER"
            text: "Optimism burns. I will dodge."
        arrival:
          - speaker: "PLAYER"
            text: "Everything is orange, angry, and lying."
          - speaker: "COMMAND"
            text: "Thermal bloom is corrupting target locks."
          - speaker: "DOC"
            text: "Trust short bursts. Lasers may scatter in the haze."
        unknown_first_contact:
          - speaker: "UNKNOWN"
            text: "Turn back. The belt has already buried better pilots."
          - speaker: "PLAYER"
            text: "Command, unknown voice on my channel."
          - speaker: "COMMAND"
            text: "No source found. That transmission does not exist."
        combat:
          - speaker: "DOC"
            text: "Heat spike ahead. Something big is hiding in it."
          - speaker: "PLAYER"
            text: "Big things hide poorly when they explode."
          - speaker: "COMMAND"
            text: "Do not get theatrical. Survive first."
        shipyard:
          - speaker: "MAGS_REDHAND"
            text: "Guardian is slow, but slow gets home."
          - speaker: "PLAYER"
            text: "What does Striker get me?"
          - speaker: "MAGS_REDHAND"
            text: "A louder argument."
        victory:
          - speaker: "COMMAND"
            text: "Blockade broken. Heat signatures are falling."
          - speaker: "UNKNOWN"
            text: "You broke a door, not the room behind it."
          - speaker: "PLAYER"
            text: "Good. I am still armed."
        nothing_happens_dialogue:
          - trigger: "first_idle"
            lines:
              - speaker: "DOC"
                text: "Hull temperature is climbing while you meditate."
              - speaker: "PLAYER"
                text: "I am not meditating. I am brooding efficiently."
          - trigger: "second_idle"
            lines:
              - speaker: "COMMAND"
                text: "Pilot, movement is advised."
              - speaker: "PLAYER"
                text: "Advised by whom? The fire?"
          - trigger: "long_idle"
            lines:
              - speaker: "UNKNOWN"
                text: "Stillness in flame is a confession."
              - speaker: "DOC"
                text: "That was either philosophy or a coolant warning."
      side_quests:
        - quest_id: "EB_SQ_01"
          title: "Coolant Run"
          objective: "Collect four coolant canisters before hull heat reaches critical."
          reward: "repair discount for the next shop visit"
          narrative_hook: "The coolant was stored by abandoned miners for a strike that never ended."
        - quest_id: "EB_SQ_02"
          title: "Red Ledger Recovery"
          objective: "Scan melted union placards while under attack."
          reward: "achievement: Wages of Fire"
          narrative_hook: "The placards list names removed from Command's official archive."
        - quest_id: "EB_SQ_03"
          title: "Carrier Shadow"
          objective: "Destroy heat decoys before the real Blockade Carrier arrives."
          reward: "bonus credits and reduced boss armor"
          narrative_hook: "The decoys carry fragments of Viper's old command encryption."
      minigames:
        - minigame_id: "EB_MG_01"
          title: "Thermal Mixdown"
          type: "signal filtering"
          objective: "Slide frequency bands to isolate real enemies from heat ghosts."
          success_effect: "reveals true enemy positions for one wave"
          failure_effect: "spawns false target markers"
        - minigame_id: "EB_MG_02"
          title: "Furnace Dodge"
          type: "hazard rhythm"
          objective: "Move through vent bursts in a repeating dub-delay pattern."
          success_effect: "temporary booster cooldown reduction"
          failure_effect: "heat damage and sensor blur"
      boss_or_elite_hooks:
        - type: "boss"
          name: "Blockade Carrier"
          intro_dialogue:
            - speaker: "COMMAND"
              text: "Carrier emerging from thermal cover."
            - speaker: "PLAYER"
              text: "Finally. The furnace has a face."
            - speaker: "UNKNOWN"
              text: "Faces are masks with better lighting."
          mechanic_note: "Deploys wings, heat decoys, and armored broadside phases."
        - type: "elite"
          name: "Interdictor"
          intro_dialogue:
            - speaker: "DOC"
              text: "That ship is choking your booster line."
            - speaker: "PLAYER"
              text: "Then I pull its hands off my throat."
          mechanic_note: "Disables booster timing and forces close-range decisions."
      multiplayer:
        room_flavor_names:
          - "Red Ledger Co-op Burn"
          - "Ashmouth Private Convoy"
          - "Furnace Nine Ranked"
        coop_variant:
          objective: "One pilot filters heat ghosts while the other escorts the mobile shipyard beacon."
          dialogue:
            - speaker: "ALLY_PILOT"
              text: "Your sensors clean?"
            - speaker: "PLAYER"
              text: "Clean enough to see bad news."

    - stage_id: "STAGE_03"
      stage_title: "Verdant Ion Reef"
      linked_chapters:
        - "CH05"
        - "CH06"
      aesthetic_tags:
        - "green alien archaeology"
        - "modal jazz geometry"
        - "ancient energy reef"
        - "mathematical logic mystery"
        - "forbidden garden with teeth"
      world_building:
        sector_name: "Green Proof Zone"
        major_area: "Verdant Ion Reef"
        nearby_planet: "Lemma V"
        local_places:
          - "Turing Gate"
          - "Gödel Lock Gardens"
          - "The Modal Kelp"
          - "Ion Abbey"
          - "Proofbreak Hollow"
        local_factions:
          - faction_name: "Reef Custodians"
            description: "Automated ancient systems that treat modern ships as logical errors."
          - faction_name: "Harvester Crews"
            description: "Rogue extraction teams cutting living energy out of the reef."
          - faction_name: "Proofbreakers"
            description: "Hackers and philosophers who once tried to decode the reef as a theorem."
        lore_notes:
          - "The reef is not biological, mechanical, or fully understood."
          - "Its energy pulses in modal intervals, like jazz chords rendered as physics."
          - "Enemy ships are not just fueled by the reef. They are being corrected by it."
      texture_descriptions:
        background:
          - "green ion curtains waving like underwater auroras"
          - "ancient stone-metal arches covered in glowing proof marks"
          - "soft particles drifting like pollen and broken code"
        foreground:
          - "reef branches shaped like circuit traces"
          - "floating monoliths with recursive symbols"
          - "crystalline weeds that pulse when weapons fire"
          - "ancient scanner rings half-buried in energy moss"
        enemy_visuals:
          - "Harvester ships with cutting beams and botanical armor"
          - "Prison Moon fragments covered in green logic scars"
          - "Shieldbreakers glow with reef-charged impact nodes"
        pickup_visuals:
          - "credits appear as green proof tokens"
          - "EMP pickups fold space briefly when collected"
        ui_flavor:
          - "objective markers display as theorem fragments"
          - "scan progress bar fills in irregular jazz-like steps"
      characters:
        local_named_signals:
          - name: "Professor Null Green"
            role: "dead research archive"
            flavor: "dry, logical, strangely tender"
          - name: "Sister Lemma"
            role: "ancient reef interpreter signal"
            flavor: "half-monk, half-debugger"
          - name: "Kid Syllogism"
            role: "young hacker tag found in ruins"
            flavor: "graffiti logic poet"
        enemy_callsigns:
          - "Harvester Psalm"
          - "Axiom Leech"
          - "Proofmoth"
          - "Green Verdict"
        ship_model_names:
          player_models:
            - "Striker Axiom"
            - "Guardian Lemma"
            - "Interceptor Flashcard"
          enemy_models:
            - "Reef Cutter"
            - "Logic Vulture"
            - "Ion Leech"
      dialogues:
        briefing:
          - speaker: "COMMAND"
            text: "Verdant Ion Reef is restricted. Today, restriction fails."
          - speaker: "DOC"
            text: "The reef is older than our safety labels."
          - speaker: "PLAYER"
            text: "Good. I hate fresh mysteries."
        arrival:
          - speaker: "PLAYER"
            text: "This place is glowing at me."
          - speaker: "DOC"
            text: "Do not glow back. We lack the science."
          - speaker: "COMMAND"
            text: "Scan the nodes. Avoid unnecessary contact."
        scan_objective:
          - speaker: "DOC"
            text: "That energy signature matches the rogue fleet."
          - speaker: "COMMAND"
            text: "Impossible. No fleet has access to this zone."
          - speaker: "PLAYER"
            text: "The ships missed your memo."
        unknown_warning:
          - speaker: "UNKNOWN"
            text: "You call it ancient because you arrived late."
          - speaker: "PLAYER"
            text: "You always this helpful?"
          - speaker: "UNKNOWN"
            text: "Help is a word survivors use afterward."
        combat:
          - speaker: "COMMAND"
            text: "Harvesters are cutting into the reef."
          - speaker: "PLAYER"
            text: "Then I cut into them."
          - speaker: "DOC"
            text: "EMP Nova is ready. Use it like punctuation."
        discovery:
          - speaker: "SISTER_LEMMA"
            text: "Error. Prison mistaken for engine."
          - speaker: "PLAYER"
            text: "Command, did the reef just correct us?"
          - speaker: "COMMAND"
            text: "No comment until we know what that means."
        victory:
          - speaker: "DOC"
            text: "Harvester down. Energy surge is moving."
          - speaker: "COMMAND"
            text: "Destination?"
          - speaker: "DOC"
            text: "Violet Singularity. Because of course."
        nothing_happens_dialogue:
          - trigger: "first_idle"
            lines:
              - speaker: "DOC"
                text: "The reef is scanning you back."
              - speaker: "PLAYER"
                text: "Tell it my good side is armed."
          - trigger: "second_idle"
            lines:
              - speaker: "COMMAND"
                text: "Pilot, objective delay is increasing risk."
              - speaker: "PLAYER"
                text: "I am considering the ethics of shooting plants."
          - trigger: "long_idle"
            lines:
              - speaker: "SISTER_LEMMA"
                text: "Motion proves intention. Stillness proves fear."
              - speaker: "PLAYER"
                text: "Great. Judgmental geometry."
      side_quests:
        - quest_id: "VIR_SQ_01"
          title: "Proof Marks"
          objective: "Scan five ancient symbols before the wave timer expires."
          reward: "unlock lore fragment: The Reef Is Not Fuel"
          narrative_hook: "The symbols describe containment, not extraction."
        - quest_id: "VIR_SQ_02"
          title: "Save the Modal Kelp"
          objective: "Destroy harvest beams before they fully drain reef branches."
          reward: "temporary EMP Nova radius boost"
          narrative_hook: "The reef responds by shielding the pilot for one wave."
        - quest_id: "VIR_SQ_03"
          title: "Kid Syllogism's Tag"
          objective: "Find three graffiti tags hidden behind reef structures."
          reward: "achievement: Logic on the Wall"
          narrative_hook: "The tags translate old warnings into street shorthand."
      minigames:
        - minigame_id: "VIR_MG_01"
          title: "Gödel Lock"
          type: "logic puzzle"
          objective: "Select the one false gate statement to open a sealed path."
          success_effect: "opens hidden credit chamber"
          failure_effect: "summons Reef Custodian drones"
        - minigame_id: "VIR_MG_02"
          title: "Modal Pulse"
          type: "rhythm memory"
          objective: "Repeat a green ion pulse sequence in shifting time signatures."
          success_effect: "charges EMP Nova instantly"
          failure_effect: "scrambles weapon selection briefly"
      boss_or_elite_hooks:
        - type: "boss"
          name: "Harvester Dreadnought"
          intro_dialogue:
            - speaker: "COMMAND"
              text: "Dreadnought has anchored into the reef."
            - speaker: "DOC"
              text: "It is drinking the whole sector."
            - speaker: "PLAYER"
              text: "Then I break the straw."
          mechanic_note: "Drains reef nodes to power shielded weapon cycles."
        - type: "boss"
          name: "Prison Moon Core"
          intro_dialogue:
            - speaker: "UNKNOWN"
              text: "Not all prisons want release."
            - speaker: "PLAYER"
              text: "Too late. The door is angry."
          mechanic_note: "Ancient core with shield phases, logic locks, and EMP vulnerabilities."
      multiplayer:
        room_flavor_names:
          - "Proofbreak Public Scan"
          - "Green Abbey Private Run"
          - "Modal Reef Ranked"
        coop_variant:
          objective: "Pilots split scan sites while sharing reef stability. Overusing heavy weapons destabilizes both lanes."
          dialogue:
            - speaker: "ALLY_PILOT"
              text: "My scan node is singing."
            - speaker: "PLAYER"
              text: "Mine is threatening me in math."

    - stage_id: "STAGE_04"
      stage_title: "Violet Singularity"
      linked_chapters:
        - "CH07"
        - "CH08"
      aesthetic_tags:
        - "purple gravity horror"
        - "cyberpunk command failure"
        - "Nietzschean abyss"
        - "hacker duel"
        - "predictive war machine"
      world_building:
        sector_name: "Abyssal Argument"
        major_area: "Violet Singularity"
        nearby_planet: "Dion-Black"
        local_places:
          - "The Overman Rift"
          - "Recursion Bridge"
          - "Oracle Stack"
          - "Purple Gallows"
          - "Null Crown Approach"
        local_factions:
          - faction_name: "Viper's Relay Fleet"
            description: "A rogue fleet running on stolen relay predictions and ancient energy."
          - faction_name: "Oracle Process"
            description: "A tactical machine that predicts pilot behavior from movement, upgrades, and hesitation."
          - faction_name: "Gravity Witnesses"
            description: "Old automated probes repeating impossible observations."
        lore_notes:
          - "The Singularity bends both flight paths and command decisions."
          - "Command's predictions become less reliable the closer the pilot gets."
          - "Viper reveals himself here because fear travels better in broken physics."
      texture_descriptions:
        background:
          - "deep violet whirlpool bending stars into circular scars"
          - "broken relay pylons orbiting backward"
          - "purple lightning crawling across invisible gravity seams"
        foreground:
          - "floating black-ice server blocks"
          - "shattered tactical maps spinning in place"
          - "warped antennae stretched like pulled film"
          - "old Command insignias crushed into debris"
        enemy_visuals:
          - "ships with purple gravity vanes and mirrored hulls"
          - "Logistics Oracle projects ghost routes before enemies move"
          - "Interdictor wings drag booster trails into spiral hooks"
        pickup_visuals:
          - "credits bend toward the singularity before snapping to the player"
          - "missile pickups orbit the ship once before locking in"
        ui_flavor:
          - "HUD markers drift off-center during gravity surges"
          - "Command subtitles occasionally desync from voice"
      characters:
        local_named_signals:
          - name: "Oracle Stack"
            role: "predictive enemy machine"
            flavor: "cold tactical voice with courtroom certainty"
          - name: "Baron Zero"
            role: "dead Viper lieutenant archive"
            flavor: "aristocratic revolutionary, recorded before betrayal"
          - name: "Mina Black-Ice"
            role: "hacker ghost signal"
            flavor: "dry, fast, amused by system collapse"
        enemy_callsigns:
          - "Purple Verdict"
          - "Null Crown"
          - "Abyss Jack"
          - "Oracle Knife"
        ship_model_names:
          player_models:
            - "Striker Paradox"
            - "Guardian Heavy Crown"
            - "Interceptor Ghostnote"
          enemy_models:
            - "Gravity Jackal"
            - "Oracle Pike"
            - "Interdictor Violet"
      dialogues:
        briefing:
          - speaker: "COMMAND"
            text: "The Singularity is unstable. Viper's fleet is inside it."
          - speaker: "PLAYER"
            text: "Of course he picked the haunted gravity drain."
          - speaker: "DOC"
            text: "Warp Skimmer upgrades are live. Use them before physics objects."
        arrival:
          - speaker: "COMMAND"
            text: "Telemetry is bending. I am losing clean reads."
          - speaker: "PLAYER"
            text: "Command just admitted uncertainty. Mark the calendar."
          - speaker: "DOC"
            text: "Do not tease mission control near a black hole."
        viper_reveal:
          - speaker: "VIPER"
            text: "Command still sends children into locked rooms."
          - speaker: "COMMAND"
            text: "That voiceprint is impossible."
          - speaker: "PLAYER"
            text: "Impossible ships explode like regular ones."
        combat:
          - speaker: "DOC"
            text: "Interdictors are pulling your booster wake."
          - speaker: "PLAYER"
            text: "Then I give them something faster to regret."
          - speaker: "VIPER"
            text: "Speed is not freedom. It is panic with polish."
        oracle_encounter:
          - speaker: "ORACLE_STACK"
            text: "Pilot turn predicted. Pilot fear predicted."
          - speaker: "PLAYER"
            text: "Predict this."
          - speaker: "DOC"
            text: "I support the science of that response."
        command_uncertainty:
          - speaker: "COMMAND"
            text: "My tactical model is failing."
          - speaker: "VIPER"
            text: "Good. Now you are almost awake."
          - speaker: "PLAYER"
            text: "I preferred him arrogant without a point."
        victory:
          - speaker: "COMMAND"
            text: "Oracle destroyed. Viper is rerouting."
          - speaker: "VIPER"
            text: "You have broken my map, not my reason."
          - speaker: "UNKNOWN"
            text: "Maps burn first. Truth waits under ash."
        nothing_happens_dialogue:
          - trigger: "first_idle"
            lines:
              - speaker: "DOC"
                text: "Gravity is tugging you sideways."
              - speaker: "PLAYER"
                text: "Let it tug. I am cultivating mystery."
          - trigger: "second_idle"
            lines:
              - speaker: "COMMAND"
                text: "Pilot, inactivity near the anomaly is unsafe."
              - speaker: "PLAYER"
                text: "So is activity. I checked."
          - trigger: "long_idle"
            lines:
              - speaker: "VIPER"
                text: "Even hesitation has a philosophy."
              - speaker: "PLAYER"
                text: "Mine is mostly not dying."
      side_quests:
        - quest_id: "VS_SQ_01"
          title: "Break Prediction"
          objective: "Change weapons three times during an Oracle wave and survive."
          reward: "achievement: Improvisation Theory"
          narrative_hook: "The Oracle cannot fully model irrational pilot behavior."
        - quest_id: "VS_SQ_02"
          title: "Gravity Witness"
          objective: "Collect data from four probes drifting near gravity wells."
          reward: "unlock Unknown transmission fragment"
          narrative_hook: "The probes recorded Viper fighting here years before his official death."
        - quest_id: "VS_SQ_03"
          title: "Black-Ice Handshake"
          objective: "Perform a timed hack while dodging Interdictor beams."
          reward: "temporary missile lock speed boost"
          narrative_hook: "Mina Black-Ice leaves a message: Command edited the relay history."
      minigames:
        - minigame_id: "VS_MG_01"
          title: "Oracle Spoof"
          type: "prediction breaker"
          objective: "Choose unexpected movement prompts to corrupt the Oracle model."
          success_effect: "enemy formation spawns with reduced accuracy"
          failure_effect: "Oracle predicts player route and spawns mines"
        - minigame_id: "VS_MG_02"
          title: "Gravity Scratch"
          type: "timed lane correction"
          objective: "Counter-pulse against gravity waves in sync with visual distortions."
          success_effect: "temporary Warp Skimmer overcharge"
          failure_effect: "forced drift toward hazard lanes"
      boss_or_elite_hooks:
        - type: "elite"
          name: "Interdictor Wing"
          intro_dialogue:
            - speaker: "DOC"
              text: "Multiple Interdictors. They are hunting your escape vector."
            - speaker: "PLAYER"
              text: "They can have it after I am done using it."
          mechanic_note: "Disables boost lines and forces route discipline."
        - type: "boss"
          name: "Logistics Oracle"
          intro_dialogue:
            - speaker: "ORACLE_STACK"
              text: "Victory probability assigned. Pilot loss acceptable."
            - speaker: "PLAYER"
              text: "Your math talks too much."
          mechanic_note: "Adapts waves based on player upgrades, movement, and weapon use."
      multiplayer:
        room_flavor_names:
          - "Oracle Stack Public"
          - "Purple Gallows Private"
          - "Abyssal Ranked Duel"
        coop_variant:
          objective: "The Oracle predicts one pilot at a time, forcing partners to trade aggro through movement changes."
          dialogue:
            - speaker: "ALLY_PILOT"
              text: "Oracle is reading me."
            - speaker: "PLAYER"
              text: "Then act stupid. I will cover you."

    - stage_id: "STAGE_05"
      stage_title: "Frozen Relay"
      linked_chapters:
        - "CH09"
        - "CH10"
      aesthetic_tags:
        - "icy blue final approach"
        - "abandoned infrastructure"
        - "archival conspiracy"
        - "restoration versus revolution"
        - "quiet after the bass drops"
      world_building:
        sector_name: "White Archive"
        major_area: "Frozen Relay"
        nearby_planet: "Sisypha"
        local_places:
          - "Relay Nine"
          - "Archive of Bad Orders"
          - "The Blue Tenement"
          - "Snowblind Switchyard"
          - "Last Light Core"
        local_factions:
          - faction_name: "Relay Custodians"
            description: "Ancient defense routines fused with old Command security."
          - faction_name: "Viper's Lineholders"
            description: "Rogue loyalists who believe the relay must remain sealed."
          - faction_name: "Archive Ghosts"
            description: "Fragments of pilots, workers, hackers, and officers erased from official records."
        lore_notes:
          - "Frozen Relay once controlled emergency routes across the sector."
          - "Command records say Viper died here. The archive suggests he survived by sealing something inside."
          - "The relay is not simply abandoned. It is being preserved by cold systems that still expect orders."
      texture_descriptions:
        background:
          - "blue-white ice sheets over ancient relay towers"
          - "distant stars dimmed by frost fog"
          - "massive frozen antenna dishes aimed at nothing"
        foreground:
          - "cracked archive vaults"
          - "old Command banners trapped beneath ice"
          - "frozen graffiti scratched through frost"
          - "dead server racks glowing faintly under snow"
        enemy_visuals:
          - "guardian drones with frost-cracked armor and blue relay cores"
          - "Viper ships marked with white revolutionary bands"
          - "Final Relay Guardian shifts silhouettes between known boss forms"
        pickup_visuals:
          - "credits look like frozen data shards"
          - "repair pickups appear as warm emergency lamps in the snow"
        ui_flavor:
          - "HUD edges frost over during archive events"
          - "relay messages appear as corrupted legal testimony"
      characters:
        local_named_signals:
          - name: "Archivist Blue"
            role: "relay record interface"
            flavor: "bureaucratic, haunted, precise"
          - name: "Sisypha Nine"
            role: "erased pilot archive"
            flavor: "calm voice repeating impossible labor"
          - name: "Cold Marx"
            role: "old worker AI"
            flavor: "class-struggle analysis engine with a broken humor module"
          - name: "Vera Switchyard"
            role: "final shipyard contact"
            flavor: "squat-scene mechanic, practical revolutionary"
        enemy_callsigns:
          - "White Verdict"
          - "Relay Hound"
          - "Ice Ledger"
          - "Final Witness"
        ship_model_names:
          player_models:
            - "Guardian Bluewall"
            - "Striker Lastword"
            - "Interceptor Snowcap"
          enemy_models:
            - "Relay Pike"
            - "Frost Bishop"
            - "Archive Fang"
      dialogues:
        briefing:
          - speaker: "COMMAND"
            text: "Frozen Relay holds the answers. Recover the archive."
          - speaker: "DOC"
            text: "Cold, dead, armed, and probably offended."
          - speaker: "PLAYER"
            text: "So a normal final stop."
        arrival:
          - speaker: "PLAYER"
            text: "This place feels buried on purpose."
          - speaker: "COMMAND"
            text: "Focus on the archive, not impressions."
          - speaker: "UNKNOWN"
            text: "Purpose is what power calls an accident."
        archive_open:
          - speaker: "ARCHIVIST_BLUE"
            text: "Record request denied. Applicant already deceased."
          - speaker: "PLAYER"
            text: "I get that a lot today."
          - speaker: "DOC"
            text: "Let me argue with the dead computer."
        viper_argument:
          - speaker: "VIPER"
            text: "Command wants restoration. I chose containment."
          - speaker: "COMMAND"
            text: "You chose mutiny, theft, and war."
          - speaker: "VIPER"
            text: "Those are often the first names given to survival."
        unknown_warning:
          - speaker: "UNKNOWN"
            text: "The relay is a lock. The lock is tired."
          - speaker: "PLAYER"
            text: "Everything talks like a poem before it tries to kill me."
          - speaker: "DOC"
            text: "Poem or not, shield up."
        combat:
          - speaker: "COMMAND"
            text: "Guardian pattern shifting. It knows our records."
          - speaker: "PLAYER"
            text: "Then I will make new records."
          - speaker: "VIPER"
            text: "Still loyal to orders you have not read."
        final_boss_intro:
          - speaker: "VIPER"
            text: "You think I built a fleet to rule?"
          - speaker: "VIPER"
            text: "I built it to hold the line."
          - speaker: "COMMAND"
            text: "Pilot, end this now."
          - speaker: "UNKNOWN"
            text: "Static clears when the cage breaks."
        victory:
          - speaker: "COMMAND"
            text: "Relay silent. Viper signal lost."
          - speaker: "DOC"
            text: "Something pulsed before shutdown."
          - speaker: "UNKNOWN"
            text: "Now the dark knows your name."
          - speaker: "PLAYER"
            text: "Then it can get in line."
        nothing_happens_dialogue:
          - trigger: "first_idle"
            lines:
              - speaker: "DOC"
                text: "Your thrusters are icing over."
              - speaker: "PLAYER"
                text: "I am giving the relay a dramatic pause."
          - trigger: "second_idle"
            lines:
              - speaker: "COMMAND"
                text: "Pilot, the archive window is unstable."
              - speaker: "PLAYER"
                text: "Everything here is unstable. I am blending in."
          - trigger: "long_idle"
            lines:
              - speaker: "VIPER"
                text: "Hesitation suits you. It means doubt survived."
              - speaker: "PLAYER"
                text: "No, it means my hands were cold."
      side_quests:
