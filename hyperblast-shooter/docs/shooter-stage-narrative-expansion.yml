          success_effect: "unlocks hidden shop before boss"
          failure_effect: "locks one repair purchase until next wave"
        - minigame_id: "FR_MG_03"
          title: "Dub Under Ice"
          type: "audio pulse timing"
          objective: "Follow low-frequency relay pulses to stabilize the final gate."
          success_effect: "grants one emergency shield refresh"
          failure_effect: "boss starts with extra shield"
      boss_or_elite_hooks:
        - type: "elite"
          name: "Shieldbreaker Guard"
          intro_dialogue:
            - speaker: "DOC"
              text: "They are aiming straight for your shields."
            - speaker: "PLAYER"
