            - speaker: "VIPER"
              text: "This is what I kept sleeping."
            - speaker: "PLAYER"
              text: "Then help me kill the nightmare."
          mechanic_note: "Cycles through Carrier, Dreadnought, Prison Core, and Oracle patterns."
      multiplayer:
        room_flavor_names:
          - "Relay Nine Public Assault"
          - "Snowblind Private Archive"
          - "Last Light Ranked Core"
        coop_variant:
          objective: "Pilots defend separate archive uplinks, then regroup for synchronized guardian phases."
          dialogue:
            - speaker: "ALLY_PILOT"
              text: "My archive says Viper was cleared."
            - speaker: "PLAYER"
              text: "Mine says buried. Nobody here agrees."
