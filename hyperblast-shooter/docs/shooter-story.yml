---
hyperblast_story_chapters:
  metadata:
    title: "Hyperblast Shooter - Multiplayer"
    genre: "Neon arcade space shooter"
    core_premise: "A lone pilot investigates coordinated rogue ship activity, unlocks emergency upgrades through salvage credits, and uncovers a hidden war around ancient energy, relay infrastructure, Viper, and an Unknown signal."
    themes:
      - "static-filled transmissions"
      - "Command losing certainty"
      - "field upgrades under pressure"
      - "ancient energy powering modern warships"
      - "Viper as villain and possible warning sign"
      - "co-op pilots entering the same unstable combat zones"

  chapters:
    - chapter_id: "CH01"
      chapter_title: "Patrol in Neon Drift"
      stage_theme: "Neon Drift"
      player_goal: "Investigate distress beacons and clear rogue scouts from the drift lanes."
      narrative_summary: "Command sends the pilot into Neon Drift for what should be a routine patrol. Rogue ships move with unusual timing, suggesting a shared command signal."
      primary_conflict: "Random pirate activity appears coordinated."
      gameplay_focus:
        - "starter combat"
        - "basic dodging"
        - "score collection"
        - "credit pickup loop"
      unlock_or_mechanic_spotlight:
        - "Interceptor"
        - "Pulse Bullets"
        - "repair purchases"
        - "score-to-credit economy"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
      sample_dialogue:
        - speaker: "COMMAND"
          text: "Pilot, Neon Drift is lighting up with distress calls."
        - speaker: "PLAYER"
          text: "Copy. I see the beacons and a lot of company."
        - speaker: "DOC"
          text: "Your Interceptor is quick. Try not to prove how fragile it is."
      boss_or_elite_hook:
        type: "elite"
        name: "Scout Pack"
        setup: "Fast rogue scouts test the player with swarm pressure."
      chapter_end_state: "The pilot confirms the rogue ships are using synchronized attack patterns."
      optional_coop_variant: "A second pilot drops into the same drift lane after their patrol route goes dark."

    - chapter_id: "CH02"
      chapter_title: "Credits Under Fire"
      stage_theme: "Neon Drift"
      player_goal: "Hold the lane long enough to recover salvage crates and encrypted ship debris."
      narrative_summary: "Doc authorizes emergency salvage conversion. Credits become field currency for repairs, weapons, boosters, and shipyard requisitions."
      primary_conflict: "The pilot must survive longer waves while damaged ships keep dropping usable tech."
      gameplay_focus:
        - "wave escalation"
        - "enemy amount slider"
        - "credit routing"
        - "shop timing"
      unlock_or_mechanic_spotlight:
        - "weapon upgrades"
        - "Ion Bloom"
        - "Auto-laser turrets"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
      sample_dialogue:
        - speaker: "DOC"
          text: "Good news. Their wreckage spends just fine."
        - speaker: "PLAYER"
          text: "So I shoot them, loot them, and upgrade?"
        - speaker: "COMMAND"
          text: "Field requisitions approved. Spend fast, Pilot."
      boss_or_elite_hook:
        type: "elite"
        name: "Shieldbreaker"
        setup: "First elite designed to punish weak defenses and careless shield use."
      chapter_end_state: "The pilot earns enough salvage authority to access deeper shipyard options."
      optional_coop_variant: "Co-op pilots share arena pressure but earn separate credit streams from tagged kills."

    - chapter_id: "CH03"
      chapter_title: "Heat Bloom Ambush"
      stage_theme: "Ember Belt"
      player_goal: "Cross the volcanic asteroid belt and locate the source of distorted command pings."
      narrative_summary: "The Ember Belt scrambles sensors. Enemy formations use heat haze as cover, and a static-filled voice cuts into the channel for the first time."
      primary_conflict: "The pilot cannot trust sensor data, and Command cannot verify the new transmission."
      gameplay_focus:
        - "ambush waves"
        - "enemy power slider"
        - "heat distortion hazards"
        - "booster management"
      unlock_or_mechanic_spotlight:
        - "Afterburner"
        - "Redline Laser"
        - "Bubble Shield"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
        - "UNKNOWN"
      sample_dialogue:
        - speaker: "UNKNOWN"
          text: "Turn back before the belt remembers you."
        - speaker: "PLAYER"
          text: "Command, tell me that was you."
        - speaker: "COMMAND"
          text: "Negative. No authorized signal on that band."
        - speaker: "DOC"
          text: "Heat bloom is eating your sensors. Trust your eyes."
      boss_or_elite_hook:
        type: "boss"
        name: "Blockade Carrier"
        setup: "A carrier emerges through the heat haze and deploys layered attack wings."
      chapter_end_state: "The pilot breaks the blockade but recovers data marked with an unknown energy signature."
      optional_coop_variant: "Private rooms allow two pilots to split asteroid lanes and collapse the carrier shield faster."

    - chapter_id: "CH04"
      chapter_title: "Shipyard Directive"
      stage_theme: "Ember Belt"
      player_goal: "Escort a mobile shipyard beacon while surviving intensified rogue attacks."
      narrative_summary: "Command escalates the mission from patrol to active containment. Doc opens heavier ship options, but warns that each frame changes how the pilot survives."
      primary_conflict: "Rogue forces adapt to the pilot’s loadout and begin targeting support systems."
      gameplay_focus:
        - "ship purchases"
        - "defensive builds"
        - "loadout identity"
        - "elite counters"
      unlock_or_mechanic_spotlight:
        - "Guardian"
        - "Striker"
        - "Piercing Beam"
        - "Forward Wall"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
      sample_dialogue:
        - speaker: "DOC"
          text: "Guardian takes a beating. Striker gives one back."
        - speaker: "PLAYER"
          text: "I like choices that explode things."
        - speaker: "COMMAND"
          text: "Choose for survival, Pilot. This is no longer a patrol."
      boss_or_elite_hook:
        type: "elite"
        name: "Interdictor"
        setup: "A disabling enemy hunts boosters and punishes reckless escape routes."
      chapter_end_state: "The shipyard confirms rogue tech contains parts from old military relay stockpiles."
      optional_coop_variant: "Ranked rooms score pilots on survival, damage share, and shipyard efficiency."

    - chapter_id: "CH05"
      chapter_title: "Verdant Ion Reef"
      stage_theme: "Verdant Ion Reef"
      player_goal: "Enter the forbidden reef and scan ancient energy nodes before the rogue fleet extracts them."
      narrative_summary: "The reef glows with ancient ion growths. The same energy found in enemy wreckage pulses through the zone, raising questions Command cannot answer."
      primary_conflict: "The enemy is harvesting an ancient power source that reacts to modern weapons."
      gameplay_focus:
        - "energy hazard navigation"
        - "scan objectives"
        - "mixed enemy formations"
        - "turret placement"
      unlock_or_mechanic_spotlight:
        - "Warp Skimmer"
        - "Blast Rockets"
        - "Wingman"
        - "Auto-laser turret upgrades"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
        - "UNKNOWN"
      sample_dialogue:
        - speaker: "DOC"
          text: "That reef is older than our maps and angrier than our engines."
        - speaker: "COMMAND"
          text: "Scan the nodes. Do not engage the core growth."
        - speaker: "UNKNOWN"
          text: "You keep calling it fuel. It is not fuel."
        - speaker: "PLAYER"
          text: "Then it can explain itself after I stop the harvest."
      boss_or_elite_hook:
        type: "boss"
        name: "Harvester Dreadnought"
        setup: "A massive extractor ship drains reef energy to power its weapon cycles."
      chapter_end_state: "The pilot destroys the harvester, but the reef energy surges toward the Violet Singularity."
      optional_coop_variant: "Co-op pilots must split scan zones while keeping harvest beams interrupted."

    - chapter_id: "CH06"
      chapter_title: "Prison Signal"
      stage_theme: "Verdant Ion Reef"
      player_goal: "Track the energy surge to a sealed reef chamber and disable rogue containment locks."
      narrative_summary: "The ancient energy behaves like a trapped signal, not a resource. Command grows uneasy as the Unknown voice sounds less like an enemy and more like a witness."
      primary_conflict: "Disabling enemy locks may also weaken whatever the locks were holding."
      gameplay_focus:
        - "objective defense"
        - "EMP timing"
        - "ally support"
        - "shield pressure"
      unlock_or_mechanic_spotlight:
        - "EMP Nova"
        - "Shield Guard"
        - "Bubble Shield upgrades"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
        - "UNKNOWN"
      sample_dialogue:
        - speaker: "COMMAND"
          text: "Those locks are rogue-built. Bring them down."
        - speaker: "UNKNOWN"
          text: "Locks can cage monsters. They can also cage warnings."
        - speaker: "PLAYER"
          text: "I am getting tired of riddles with guns attached."
        - speaker: "DOC"
          text: "EMP Nova is live. One pulse, big consequences."
      boss_or_elite_hook:
        type: "boss"
        name: "Prison Moon Core"
        setup: "A moon-sized defense core activates when the containment locks fail."
      chapter_end_state: "The core falls. A name is recovered from its final burst: Viper."
      optional_coop_variant: "Public co-op rooms trigger shared containment events with multiple lock sites."

    - chapter_id: "CH07"
      chapter_title: "Violet Singularity"
      stage_theme: "Violet Singularity"
      player_goal: "Survive the gravity anomaly and confirm whether Viper commands the rogue fleet."
      narrative_summary: "The battlefield bends under purple gravity waves. Command identifies Viper, a rogue commander believed dead. Viper answers personally."
      primary_conflict: "The mission shifts from suppression to confrontation with a living ghost."
      gameplay_focus:
        - "gravity pull hazards"
        - "boss preparation"
        - "high-speed dodging"
        - "loadout stress testing"
      unlock_or_mechanic_spotlight:
        - "Homing Missiles"
        - "Warp Skimmer upgrades"
        - "advanced shipyard requisitions"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
        - "VIPER"
      sample_dialogue:
        - speaker: "COMMAND"
          text: "That voiceprint is impossible. Viper died at Relay Nine."
        - speaker: "VIPER"
          text: "Command writes graves faster than it writes truth."
        - speaker: "PLAYER"
          text: "Then come prove you are not just another signal glitch."
        - speaker: "DOC"
          text: "Gravity shear is climbing. Fly loose or get folded."
      boss_or_elite_hook:
        type: "elite"
        name: "Interdictor Wing"
        setup: "Multiple Interdictors drag pilots toward gravity wells while Viper observes."
      chapter_end_state: "Viper confirms he controls the rogue fleet and directs the pilot toward Frozen Relay."
      optional_coop_variant: "Co-op pilots experience shared gravity surges that force formation flying."

    - chapter_id: "CH08"
      chapter_title: "Oracle in the Gravity Well"
      stage_theme: "Violet Singularity"
      player_goal: "Destroy Viper’s logistics node before it reroutes the fleet through old relay lanes."
      narrative_summary: "A predictive command machine called the Logistics Oracle guides enemy waves with impossible precision. Command loses tactical confidence as the Oracle predicts every move."
      primary_conflict: "The enemy knows the pilot’s route before the pilot takes it."
      gameplay_focus:
        - "adaptive wave patterns"
        - "enemy amount and power spikes"
        - "missile control"
        - "coordinated defense"
      unlock_or_mechanic_spotlight:
        - "Homing Missiles upgrades"
        - "Forward Wall upgrades"
        - "ranked mission variants"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
        - "VIPER"
      sample_dialogue:
        - speaker: "COMMAND"
          text: "The Oracle is predicting our commands before I send them."
        - speaker: "PLAYER"
          text: "Good. I will stop following orders for a minute."
        - speaker: "VIPER"
          text: "Improvisation. The last honest weapon."
        - speaker: "DOC"
          text: "I hate that he is right. Break the pattern."
      boss_or_elite_hook:
        type: "boss"
        name: "Logistics Oracle"
        setup: "A tactical AI node changes enemy formations based on player upgrades and movement."
      chapter_end_state: "The Oracle is destroyed, but its final route points to Frozen Relay."
      optional_coop_variant: "Ranked co-op rooms rotate Oracle modifiers, rewarding teams that counter adaptive waves."

    - chapter_id: "CH09"
      chapter_title: "Frozen Relay Approach"
      stage_theme: "Frozen Relay"
      player_goal: "Reach the abandoned relay station and recover buried Command records."
      narrative_summary: "The relay is frozen, silent, and older than the official war logs. Viper claims Command buried the truth here. Unknown warns that opening the relay will wake more than records."
      primary_conflict: "The pilot must decide whether to trust Command’s orders, Viper’s accusation, or Unknown’s warning."
      gameplay_focus:
        - "final approach waves"
        - "ice-field hazards"
        - "ally survival"
        - "defense layering"
      unlock_or_mechanic_spotlight:
        - "full shipyard access"
        - "late-game repairs"
        - "Wingman upgrades"
        - "Shield Guard upgrades"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
        - "UNKNOWN"
        - "VIPER"
      sample_dialogue:
        - speaker: "COMMAND"
          text: "Recover the relay archive. Ignore Viper."
        - speaker: "VIPER"
          text: "Yes, Pilot. Ignore the dead man standing in your way."
        - speaker: "UNKNOWN"
          text: "The ice is not sealing the relay. It is preserving it."
        - speaker: "PLAYER"
          text: "Everyone wants me afraid of a door. Opening it."
      boss_or_elite_hook:
        type: "elite"
        name: "Shieldbreaker Guard"
        setup: "Elite defenders target shields and allied escorts during archive extraction."
      chapter_end_state: "The archive opens and shows Viper fought near the relay before his supposed death."
      optional_coop_variant: "Co-op teams defend separate archive uplinks while sharing a limited repair pool."

    - chapter_id: "CH10"
      chapter_title: "Last Light of the Relay"
      stage_theme: "Frozen Relay"
      player_goal: "Defeat Viper’s final guardian and stop the relay from broadcasting through the sector."
      narrative_summary: "Viper confronts the pilot at the relay core. He insists he has been containing a deeper threat, not conquering the sector. Command demands the relay be silenced. Unknown does not choose a side."
      primary_conflict: "Victory may release the mystery Viper was holding back."
      gameplay_focus:
        - "final boss sequence"
        - "all systems mastery"
        - "boss rotation setup"
        - "postgame transition"
      unlock_or_mechanic_spotlight:
        - "endless stage loop"
        - "boss rotation"
        - "anomaly reports"
        - "co-op mission variants"
      key_characters:
        - "PLAYER"
        - "COMMAND"
        - "DOC"
        - "UNKNOWN"
        - "VIPER"
      sample_dialogue:
        - speaker: "VIPER"
          text: "You think I built a fleet to rule? I built it to hold the line."
        - speaker: "COMMAND"
          text: "Pilot, end this. Now."
        - speaker: "UNKNOWN"
          text: "Static clears when the cage breaks."
        - speaker: "PLAYER"
          text: "Then everyone better hope I am shooting the right lock."
      boss_or_elite_hook:
        type: "boss"
        name: "Final Relay Guardian"
        setup: "A relay-bound guardian cycles through carrier, dreadnought, prison core, and oracle attack patterns."
      chapter_end_state: "Viper is defeated or forced to retreat. The relay falls silent, then emits one unknown pulse."
      optional_coop_variant: "Final co-op rooms scale the guardian with synchronized phase mechanics and shared revive windows."

  postgame_loop:
    premise: "The relay pulse fractures known routes. Command begins issuing repeat dispatches through unstable versions of Neon Drift, Ember Belt, Verdant Ion Reef, Violet Singularity, and Frozen Relay."
    rotating_elements:
      stages:
        - "Neon Drift"
        - "Ember Belt"
        - "Verdant Ion Reef"
        - "Violet Singularity"
        - "Frozen Relay"
      boss_archetypes:
        - "Blockade Carrier"
        - "Harvester Dreadnought"
        - "Prison Moon Core"
        - "Logistics Oracle"
        - "Final Relay Guardian variants"
      elite_archetypes:
        - "Scout Pack"
        - "Shieldbreaker"
        - "Interdictor"
      modifiers:
        - "increased enemy amount"
        - "increased enemy power"
        - "distorted sensors"
        - "unstable ancient energy"
        - "limited repairs"
        - "co-op split objectives"
    narrative_delivery:
      - "dispatch logs"
      - "intercepted Viper fragments"
      - "Unknown static warnings"
      - "Doc shipyard notes"
      - "Command anomaly reports"
      - "achievement blurbs"
      - "co-op room briefings"
